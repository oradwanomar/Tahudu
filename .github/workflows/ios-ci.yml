name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Verify Xcode and simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Check formatting
        run: .githooks/swiftformat.sh lint

      - name: Scan repository history
        run: |
          gitleaks_bin=$(.githooks/ensure-tool.sh gitleaks)
          "$gitleaks_bin" git --redact --no-banner --config .gitleaks.toml --log-opts='--all' .

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build and test
        run: bundle exec fastlane ios verify

      - name: Prepare test summary
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -d "$RUNNER_TEMP/Tahudu.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/Tahudu.xcresult" \
              > "$RUNNER_TEMP/test-summary.json"
          fi

      - name: Build Release configuration
        if: github.event_name == 'pull_request'
        run: bundle exec fastlane ios simulator_build

      - name: Upload test summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Tahudu-test-summary
          path: ${{ runner.temp }}/test-summary.json
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tahudu-test-results
          path: ${{ runner.temp }}/Tahudu.xcresult
