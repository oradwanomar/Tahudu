name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Verify Xcode and simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Check formatting
        run: .githooks/swiftformat.sh lint

      - name: Scan repository history
        run: |
          gitleaks_bin=$(.githooks/ensure-tool.sh gitleaks)
          "$gitleaks_bin" git --redact --no-banner --config .gitleaks.toml --log-opts='--all' .

      - name: Build and test
        run: |
          xcodebuild test \
            -project Tahudu.xcodeproj \
            -scheme Tahudu \
            -testPlan Tahudu \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
